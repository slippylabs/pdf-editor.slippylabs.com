# The PDF Editor is ARCHIVED (2026-10-13). PdfCraft, an open-source ArtCraft
# PDF editor installed by the craftsuite repo, replaced it on
# projects.slippylabs.com. This block only keeps old links working; the docroot
# was moved to ~/archive/pdf-editor-www-2026-10-13.tar.gz. The vhost that
# served the app is in this file's git history (v1.1.4).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name pdf-editor.slippylabs.com;
    include snippets/security-headers.conf;
    include snippets/block-dotfiles.conf;

    ssl_certificate     /etc/letsencrypt/live/slippylabs-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/slippylabs-wildcard/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        return 301 https://pdfcraft.slippylabs.com/;
    }
}
